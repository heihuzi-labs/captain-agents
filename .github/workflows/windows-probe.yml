name: Windows probe

# Measures things that can only be measured on a real Windows machine: a job dispatched end to end with Codex's
# own sandbox (docs/design-windows.md sections 12 and 14), the custom endpoint probe and the core test suite. It publishes nothing; results are workflow artifacts.
# Runs when started by hand, or on a push to a branch named probe/...

on:
  workflow_dispatch:
  push:
    branches:
      - 'probe/**'

permissions:
  contents: read

jobs:
  online-update:
    name: Real NSIS online update (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile
      # 测试密钥只在脚本内生成；不注入正式更新或代码签名机密，不发布安装包。
      - name: Install old version, update through the real window and check the new version
        shell: bash
        run: node test/e2e/update-windows.ts "$RUNNER_TEMP/update-windows-results"
      - name: Upload the update report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-windows
          path: ${{ runner.temp }}/update-windows-results/*
          if-no-files-found: warn
          retention-days: 14

  codex-sandbox:
    name: Codex dispatch (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two server images and one Windows 11 image (the closest to a user's machine).
        os: [windows-2022, windows-2025, windows-11-arm]
    env:
      # The Codex release the probes were written against. Change it together with the research note.
      CODEX_RELEASE: 0.162.1
      CODEX_NON_INTERACTIVE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # The platform runs from the source tree here; on Windows it needs the module that calls the system directly.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Install the Codex command line (official installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'codex-install.ps1'
          Invoke-WebRequest -Uri 'https://chatgpt.com/codex/install.ps1' -OutFile $script
          & $script
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Programs\OpenAI') | Select-Object -First 50 FullName; throw 'codex.exe not found' }
          "CODEX_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe --version

      # With nothing else installed, does a job dispatched by the platform's own commands get done
      # (docs/design-windows.md sections 12 and 14). A local fake endpoint and a throwaway key.
      - name: Dispatch a job end to end
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          $env:XAGENTS_CODEX = $env:CODEX_EXE
          node scripts/probe/windows-dispatch.mjs "probe-results/dispatch-${{ matrix.os }}.json" -- node src/cli/cli.ts
          $write = $LASTEXITCODE
          # A read-only job (a review): the command must still run inside the isolation.
          $env:XA_DISPATCH_RO = '1'
          node scripts/probe/windows-dispatch.mjs "probe-results/dispatch-ro-${{ matrix.os }}.json" -- node src/cli/cli.ts
          if ($write -ne 0) { exit $write }

      # A user's Codex that talks to a custom endpoint (docs/design-scan.md): does a job get out with today's
      # launch arguments, and with the endpoint carried over. A local fake endpoint and a throwaway key.
      - name: Custom endpoint probe
        if: always()
        shell: pwsh
        run: |
          node scripts/probe/codex-endpoint.mjs "$env:CODEX_EXE" "probe-results/endpoint-${{ matrix.os }}.json"
          exit 0

      - name: Print the result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "probe-results/endpoint-${{ matrix.os }}.json") { Get-Content "probe-results/endpoint-${{ matrix.os }}.json" }

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-codex-${{ matrix.os }}
          path: probe-results/*
          if-no-files-found: warn
          retention-days: 14

  # The three things the platform starts a hidden PowerShell for (keeping the machine awake, the process list, the
  # recycle bin), done by calling the system directly instead, and compared with today's way (docs/design-windows.md 13).
  native:
    name: System calls without PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Run the probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          node scripts/probe/windows-native.mjs "probe-results/native-${{ matrix.os }}.json"

      # The pipeline runs as an administrator; a user's machine normally does not. The same probe once more from a
      # process without administrator rights. For the lead to look at: it may not be possible on a runner at all.
      - name: Run the probe without administrator rights
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $PWD "probe-results\native-plain-${{ matrix.os }}.json"
          $cmd = Join-Path $env:RUNNER_TEMP 'native-plain.cmd'
          "@echo off`r`ncd /d `"$PWD`"`r`nnode scripts\probe\windows-native.mjs `"$out`" > `"$out.log`" 2>&1" | Out-File -FilePath $cmd -Encoding ascii
          runas /trustlevel:0x20000 $cmd
          for ($i = 0; $i -lt 60 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $out) { Get-Content $out } else { 'the run without administrator rights left no result'; if (Test-Path "$out.log") { Get-Content "$out.log" } }
          exit 0

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-native-${{ matrix.os }}
          path: probe-results/*
          if-no-files-found: warn
          retention-days: 14

  # Whole pages at several display scales, for the lead to look at (docs/design-windows.md section 11.2).
  # The app is built but not packed, so a round takes a few minutes.
  page-shots:
    name: Page screenshots (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CODEX_RELEASE: 0.162.1
      CODEX_NON_INTERACTIVE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: npm run build

      # With Codex on the machine the workers page lists it (and DeepSeek, which borrows its program);
      # Grok and Cursor are not offered on Windows, so the page shows the line that says why.
      - name: Install the Codex command line (official installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'codex-install.ps1'
          Invoke-WebRequest -Uri 'https://chatgpt.com/codex/install.ps1' -OutFile $script
          & $script
          & (Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe') --version

      # The default screen of a runner is smaller than the window the screenshots use.
      - name: Make the screen larger
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { "could not change the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SystemInformation]::VirtualScreen

      - name: Take the screenshots
        shell: bash
        run: node test/e2e/page-shots.ts shots --scales 1.25,1,1.5

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-shots
          path: shots/*
          if-no-files-found: warn
          retention-days: 14

  # The suites take a long time; on a push they run only when the commit message says [tests].
  # Three copies side by side: a test that only fails now and then shows up sooner.
  tests:
    name: Test suites (windows-2022, run ${{ matrix.run }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tests]')
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Type check
        shell: bash
        run: npm run typecheck

      # A per-test timeout turns a test that never ends into a failure, so one run lists every problem.
      - name: Core tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p test-logs
          node --test --test-timeout=120000 "test/*.test.ts" 2>&1 | tee test-logs/core.log
          status=${PIPESTATUS[0]}
          echo "---- failed ----"
          grep -E "^(✖|not ok)" test-logs/core.log | sort -u || true
          tail -n 12 test-logs/core.log
          exit "$status"

      - name: UI tests
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p test-logs
          npm run test:ui 2>&1 | tee test-logs/ui.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.run }}
          path: test-logs/*
          if-no-files-found: warn
          retention-days: 14
