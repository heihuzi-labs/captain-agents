name: Windows probe

# Measures things that can only be measured on a real Windows machine: the isolation probes
# (docs/design-windows.md) and the core test suite. It publishes nothing; results are workflow artifacts.
# Runs when started by hand, or on a push to a branch named probe/...

on:
  workflow_dispatch:
  push:
    branches:
      - 'probe/**'

permissions:
  contents: read

jobs:
  codex-sandbox:
    name: Codex sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two server images and one Windows 11 image (the closest to a user's machine).
        os: [windows-2022, windows-2025, windows-11-arm]
    env:
      # The Codex release the probes were written against. Change it together with the research note.
      CODEX_RELEASE: 0.162.1
      CODEX_NON_INTERACTIVE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # The platform runs from the source tree here; on Windows it needs the module that calls the system directly.
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Install the Codex command line (official installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'codex-install.ps1'
          Invoke-WebRequest -Uri 'https://chatgpt.com/codex/install.ps1' -OutFile $script
          & $script
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem -Recurse (Join-Path $env:LOCALAPPDATA 'Programs\OpenAI') | Select-Object -First 50 FullName; throw 'codex.exe not found' }
          "CODEX_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $exe --version

      # Before anything else touches the machine: with nothing installed for hardening, does a job dispatched by the
      # platform's own commands get done (docs/design-windows.md section 12). A local fake endpoint and a throwaway key.
      - name: Dispatch a job end to end, nothing installed
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          $env:XAGENTS_CODEX = $env:CODEX_EXE
          node scripts/probe/windows-dispatch.mjs "probe-results/dispatch-${{ matrix.os }}.json" -- node src/cli/cli.ts
          $write = $LASTEXITCODE
          # A read-only job (a review): the command must still run inside the isolation.
          $env:XA_DISPATCH_RO = '1'
          node scripts/probe/windows-dispatch.mjs "probe-results/dispatch-ro-${{ matrix.os }}.json" -- node src/cli/cli.ts
          if ($write -ne 0) { exit $write }

      - name: Run the probes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          node scripts/probe/windows-codex.mjs "$env:CODEX_EXE" "probe-results/codex-${{ matrix.os }}.json"

      # The real thing: the platform's own setup command and its own self-check, with a throwaway registry.
      - name: Install the isolation and run the self-check
        if: always()
        shell: pwsh
        env:
          XAGENTS_HOME: ${{ runner.temp }}\xagents-home
        run: |
          $env:XAGENTS_CODEX = $env:CODEX_EXE
          New-Item -ItemType Directory -Force $env:XAGENTS_HOME | Out-Null
          $before = Get-ChildItem -Force $env:USERPROFILE | Select-Object -ExpandProperty Name
          node src/cli/cli.ts selfcheck
          "exit code before setup: $LASTEXITCODE"
          node src/cli/cli.ts windows-setup
          "setup exit code: $LASTEXITCODE"
          node src/cli/cli.ts selfcheck
          $code = $LASTEXITCODE
          "self-check exit code: $code"
          "new entries in the home directory after the self-check (there should be none):"
          Get-ChildItem -Force $env:USERPROFILE | Where-Object { $before -notcontains $_.Name } | Select-Object -ExpandProperty Name
          Copy-Item (Join-Path $env:XAGENTS_HOME 'cache\selfcheck.json') "probe-results/selfcheck-${{ matrix.os }}.json" -ErrorAction SilentlyContinue
          # The platform's own folder made writable for everyone: the self-check must refuse (docs/design-windows.md 11.1).
          icacls "$env:GITHUB_WORKSPACE" /grant '*S-1-1-0:(OI)(CI)M' | Out-Null
          node src/cli/cli.ts selfcheck
          "self-check exit code with a program folder everyone can write to (must not be 0): $LASTEXITCODE"
          Copy-Item (Join-Path $env:XAGENTS_HOME 'cache\selfcheck.json') "probe-results/selfcheck-writable-${{ matrix.os }}.json" -ErrorAction SilentlyContinue
          icacls "$env:GITHUB_WORKSPACE" /remove '*S-1-1-0' | Out-Null
          # A home directory like a real one: tens of thousands of files under the folders the permission table
          # denies. How long does the self-check take then, and is a second run faster? (docs/design-windows.md 11.5)
          node -e "const fs=require('fs'),path=require('path');for(const d of ['.claude/projects','.codex/sessions','.cursor/extensions','.ssh']){for(let i=0;i<80;i++){const dir=path.join(process.env.USERPROFILE,d,'d'+i);fs.mkdirSync(dir,{recursive:true});for(let j=0;j<250;j++)fs.writeFileSync(path.join(dir,'f'+j+'.txt'),'x');}}"
          "files under .claude: $((Get-ChildItem -Recurse -File (Join-Path $env:USERPROFILE '.claude')).Count)"
          foreach ($n in 1, 2) {
            $t = Measure-Command { node src/cli/cli.ts selfcheck | Out-Host }
            "self-check with a big home, run ${n}: exit code $LASTEXITCODE, $([int]$t.TotalSeconds) seconds"
            Copy-Item (Join-Path $env:XAGENTS_HOME 'cache\selfcheck.json') "probe-results/selfcheck-bighome-$n-${{ matrix.os }}.json" -ErrorAction SilentlyContinue
          }
          node src/cli/cli.ts windows-setup --remove
          node src/cli/cli.ts selfcheck
          "self-check exit code without the fence: $LASTEXITCODE"
          Copy-Item (Join-Path $env:XAGENTS_HOME 'cache\selfcheck.json') "probe-results/selfcheck-nofence-${{ matrix.os }}.json" -ErrorAction SilentlyContinue
          exit 0

      # The state the owner's machine is in: the hardened isolation has been installed for this Codex folder, but the
      # self-check does not pass, so a dispatch still takes the plain path. Does the job get done then?
      - name: Dispatch a job end to end, hardening installed but not in use
        if: always()
        shell: pwsh
        env:
          XA_DISPATCH_AFTER_SETUP: '1'
        run: |
          $env:XAGENTS_CODEX = $env:CODEX_EXE
          node scripts/probe/windows-dispatch.mjs "probe-results/dispatch-after-setup-${{ matrix.os }}.json" -- node src/cli/cli.ts

      # A user's Codex that talks to a custom endpoint (docs/design-scan.md): does a job get out with today's
      # launch arguments, and with the endpoint carried over. A local fake endpoint and a throwaway key.
      - name: Custom endpoint probe
        if: always()
        shell: pwsh
        run: |
          node scripts/probe/codex-endpoint.mjs "$env:CODEX_EXE" "probe-results/endpoint-${{ matrix.os }}.json"
          exit 0

      - name: Print the result
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "probe-results/codex-${{ matrix.os }}.json") { Get-Content "probe-results/codex-${{ matrix.os }}.json" }
          if (Test-Path "probe-results/endpoint-${{ matrix.os }}.json") { Get-Content "probe-results/endpoint-${{ matrix.os }}.json" }

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-codex-${{ matrix.os }}
          path: probe-results/*
          if-no-files-found: warn
          retention-days: 14

  # The three things the platform starts a hidden PowerShell for (keeping the machine awake, the process list, the
  # recycle bin), done by calling the system directly instead, and compared with today's way (docs/design-windows.md 13).
  native:
    name: System calls without PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: TEMP one test many times
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          for i in $(seq 1 14); do
            node --test --test-timeout=200000 --test-name-pattern="续接按路径比较" test/chat-engine.test.ts > one.log 2>&1 && echo "run $i ok" || { echo "run $i FAILED"; grep -A8 "AssertionError" one.log | head -14; }
          done

      - name: Run the probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force probe-results | Out-Null
          node scripts/probe/windows-native.mjs "probe-results/native-${{ matrix.os }}.json"

      # The pipeline runs as an administrator; a user's machine normally does not. The same probe once more from a
      # process without administrator rights. For the lead to look at: it may not be possible on a runner at all.
      - name: Run the probe without administrator rights
        if: always()
        shell: pwsh
        run: |
          $out = Join-Path $PWD "probe-results\native-plain-${{ matrix.os }}.json"
          $cmd = Join-Path $env:RUNNER_TEMP 'native-plain.cmd'
          "@echo off`r`ncd /d `"$PWD`"`r`nnode scripts\probe\windows-native.mjs `"$out`" > `"$out.log`" 2>&1" | Out-File -FilePath $cmd -Encoding ascii
          runas /trustlevel:0x20000 $cmd
          for ($i = 0; $i -lt 60 -and -not (Test-Path $out); $i++) { Start-Sleep -Seconds 2 }
          if (Test-Path $out) { Get-Content $out } else { 'the run without administrator rights left no result'; if (Test-Path "$out.log") { Get-Content "$out.log" } }
          exit 0

      - name: Upload the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-native-${{ matrix.os }}
          path: probe-results/*
          if-no-files-found: warn
          retention-days: 14

  # Whole pages at several display scales, for the lead to look at (docs/design-windows.md section 11.2).
  # The app is built but not packed, so a round takes a few minutes.
  page-shots:
    name: Page screenshots (windows-2022)
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CODEX_RELEASE: 0.162.1
      CODEX_NON_INTERACTIVE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Build
        shell: bash
        run: npm run build

      # With Codex on the machine the workers page lists it (and DeepSeek, which borrows its program);
      # Grok and Cursor are not offered on Windows, so the page shows the line that says why.
      - name: Install the Codex command line (official installer)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Join-Path $env:RUNNER_TEMP 'codex-install.ps1'
          Invoke-WebRequest -Uri 'https://chatgpt.com/codex/install.ps1' -OutFile $script
          & $script
          & (Join-Path $env:LOCALAPPDATA 'Programs\OpenAI\Codex\bin\codex.exe') --version

      # The default screen of a runner is smaller than the window the screenshots use.
      - name: Make the screen larger
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force } catch { "could not change the resolution: $_" }
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.SystemInformation]::VirtualScreen

      - name: Take the screenshots
        shell: bash
        run: node test/e2e/page-shots.ts shots --scales 1.25,1,1.5

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-shots
          path: shots/*
          if-no-files-found: warn
          retention-days: 14

  # The suites take a long time; on a push they run only when the commit message says [tests].
  # Three copies side by side: a test that only fails now and then shows up sooner.
  tests:
    name: Test suites (windows-2022, run ${{ matrix.run }})
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[tests]')
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.2
          pnpm install --frozen-lockfile

      - name: Type check
        shell: bash
        run: npm run typecheck

      # A per-test timeout turns a test that never ends into a failure, so one run lists every problem.
      - name: Core tests
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p test-logs
          node --test --test-timeout=120000 "test/*.test.ts" 2>&1 | tee test-logs/core.log
          status=${PIPESTATUS[0]}
          echo "---- failed ----"
          grep -E "^(✖|not ok)" test-logs/core.log | sort -u || true
          tail -n 12 test-logs/core.log
          exit "$status"

      - name: UI tests
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p test-logs
          npm run test:ui 2>&1 | tee test-logs/ui.log
          exit "${PIPESTATUS[0]}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.run }}
          path: test-logs/*
          if-no-files-found: warn
          retention-days: 14
